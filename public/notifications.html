<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    /* Notification styles */
    #notifContainer {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      width: 300px;
    }
    .notification {
      background: #007BFF;
      color: white;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.5s;
    }
    .notification a {
      color: #FFD700;
      text-decoration: underline;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Dashboard</h1>
  <div id="notifContainer"></div>

  <script>
    // Polling for notifications every 3 seconds
    setInterval(async () => {
      try {
        const response = await fetch('http://localhost:3000/notifications', {
          method: 'GET',
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("token")
          },
          credentials: 'include'
        });

        if (!response.ok) {
          throw new Error("Failed to fetch notifications");
        }

        const notifications = await response.json();
 
        // Clear existing notifications
        const notifContainer = document.getElementById("notifContainer");
        notifContainer.innerHTML = '';

        // Check if there are notifications
        if (notifications.length > 0) {
          notifications.forEach(notification => {
            // Create a div for each notification
            const notifDiv = document.createElement("div");
            notifDiv.classList.add("notification");

            // Link to request details using notification.request_id
            notifDiv.innerHTML = `
              <p>${notification.message}</p>
              <a href="/requests/${notification.request_id}">View Details</a>
            `;
            notifContainer.appendChild(notifDiv);

            // Optional: Automatically hide after 5 seconds
            setTimeout(() => {
              notifDiv.remove();
            }, 5000);
          });
        }
      } catch (error) {
        console.error('Error fetching notifications:', error);
      }
    }, 3000); // Poll every 3 seconds
  </script>  
</body>
</html>
