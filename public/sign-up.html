<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <style>
    /* Basic styling for the sign-up form */
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .signup-container {
      background-color: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 320px;
    }

    .signup-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .signup-container form {
      display: flex;
      flex-direction: column;
    }

    .signup-container label {
      margin-top: 10px;
      font-size: 0.9em;
    }

    .signup-container input,
    .signup-container select {
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
    }

    .signup-container button {
      margin-top: 20px;
      padding: 10px;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      cursor: pointer;
    }

    .signup-container button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <div class="signup-container">
    <h2>Sign Up</h2>
    <!-- Form submits to your sign-up endpoint -->
    <form action="/sign-up" method="POST">
      <!-- Username Field -->
      <label for="username">Username</label>
      <input type="text" id="username" name="username" maxlength="50" required>

      <!-- Email Field -->
      <label for="email">Email</label>
      <input type="email" id="email" name="email" maxlength="100" required>

      <!-- Password Field -->
      <label for="password">Password</label>
      <input type="password" id="password" name="password" maxlength="255" required>

      <!-- Role Field (Drop-Down for Enum Options) -->
      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="">Select Role</option>
        <option value="student">Student</option>
        <option value="lecturer">Lecturer</option>
        <option value="hod">HOD</option>
        <option value="registrar">Registrar</option>
      </select>

      <!-- Department Field -->
      <label for="department">Department</label>
      <input type="text" id="department" name="department" maxlength="100" required>

      <!-- The created_at field is typically auto-generated by the database -->
      <p>Already have an account? <a href="/login">Login</a></p>
      <button type="submit" class="sign-up" id="signupBtn">Sign Up</button>
    </form>
  </div>
  <script src="/js/sign-up.js"></script>
</body>

</html>
