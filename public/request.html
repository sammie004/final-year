<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Request</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <link rel="icon" href="/Screenshot (125).png" type="image/x-icon">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      padding-top: 100px;
      /* account for fixed navbar */
    }

    /* Navbar styling: fixed at top */
    .navbar {
      background-color: #020167;
      height: 92px;
    }

    /* Notification container */
    #notifContainer {
      position: fixed;
      top: 110px;
      /* below navbar */
      right: 10px;
      z-index: 1050;
      width: 300px;
    }

    /* Back button styling */
    #backBtn {
      position: fixed;
      top: 100px;
      left: 20px;
      cursor: pointer;
      font-size: 2rem;
      transition: color 0.5s ease;
    }

    #backBtn:hover {
      color: grey;
    }

    /* Form container styling */
    #requestForm {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
    }

    /* Form elements */
    #requestForm label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #333;
    }

    #requestForm input,
    #requestForm select,
    #requestForm textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      height: 45px;
    }

    #requestForm textarea {
      height: 150px;
      resize: vertical;
    }

    #requestForm button[type="submit"] {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #020167;
      color: white;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    #requestForm button[type="submit"]:hover {
      background-color: #000;
    }

    /* File upload container styling */
    .file-upload-container {
      position: relative;
      width: 200px;
      height: 200px;
      border: 2px dashed #ccc;
      border-radius: 10px;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hide default file input */
    #file {
      display: none;
    }

    /* Custom file input label as a centered icon */
    .custom-file-label {
      color: #020167;
      font-size: 2rem;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .custom-file-label:hover {
      color: #000;
    }

    @media (max-width: 576px) {
      #requestForm {
        margin: 10px;
      }

      .file-upload-container {
        width: 155px;
        height: 125px;
      }

      .custom-file-label {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <!-- Fixed Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Result Upload Automation System</a>
    </div>
  </nav>

  <!-- Back button -->
  <i class='bx bx-arrow-back' id="backBtn"></i>

  <!-- Notification container -->
  <div id="notifContainer"></div>

  <!-- Submit Request Form -->
  <div class="container">
    <form id="requestForm">
      <label for="student_ID">Student ID:</label>
      <input type="text" id="student_ID" name="student_id" readonly>

      <label for="course_code">Course Code:</label>
      <input type="text" id="course_code" name="course_code" required>

      <label for="course_title">Course Title:</label>
      <input type="text" id="course_title" name="course_title" required>

      <label for="level_taken">Level taken:</label>
      <select id="level_taken" name="level_taken" required>
        <option value="">--Select Level--</option>
        <option value="100">100 level</option>
        <option value="200">200 level</option>
        <option value="300">300 level</option>
        <option value="400">400 level</option>
        <option value="500">500 level</option>
        <option value="600">600 level</option>
      </select>

      <label for="lecturer">Select Lecturer:</label>
      <select id="lecturer" name="lecturer_id" required>
        <option value="">--Select Lecturer--</option>
      </select>

      <!-- File upload area -->
      <label for="file">Upload your result (PDF):</label>
      <div class="file-upload-container">
        <label for="file" class="custom-file-label">
          <img src="Vector.png" alt="" srcset="">
        </label>
        <input type="file" name="file" id="file" required>
      </div>

      <label for="issues">Issues faced:</label>
      <textarea name="issues" id="issue_faced"></textarea>

      <button type="submit">Submit Request</button>
    </form>
  </div>

  <script>
    // Back button functionality
    const back = document.querySelector("#backBtn");
    back.addEventListener("click", (e) => {
      e.preventDefault();
      window.history.back();
    });

    // Set student ID from localStorage
    const studentIdInput = document.querySelector("#student_ID");
    const storedUserId = localStorage.getItem("UserID");
    studentIdInput.value = storedUserId;

    // Load lecturers based on student's department
    async function loadLecturers() {
      const department = localStorage.getItem("Department");
      console.log("Department from localStorage:", department);
      try {
        const response = await fetch(`http://localhost:3000/lecturers?department=${department}`, {
          method: "GET",
          headers: { "Content-Type": "application/json" },
          credentials: "include"
        });
        console.log("Fetch response status:", response.status);
        const lecturers = await response.json();
        console.log("Lecturers fetched:", lecturers);

        const lecturerDropdown = document.getElementById("lecturer");
        lecturerDropdown.innerHTML = "<option value=''>--Select Lecturer--</option>";
        if (lecturers.length === 0) {
          console.warn("No lecturers returned from the server.");
        }
        lecturers.forEach((lecturer) => {
          const option = document.createElement("option");
          option.value = lecturer.user_id;
          option.textContent = lecturer.username;
          lecturerDropdown.appendChild(option);
        });
      } catch (error) {
        console.error("Error fetching lecturers:", error);
      }
    }
    window.addEventListener("load", loadLecturers);

    // Form submission handler
    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const student_id = document.getElementById("student_ID").value;
      const course_code = document.getElementById("course_code").value;
      const course_title = document.getElementById("course_title").value;
      const lecturer_id = document.getElementById("lecturer").value;
      const level_taken = document.getElementById("level_taken").value;
      const issue_faced = document.getElementById("issue_faced").value;

      const requestData = { student_id, course_code, course_title, lecturer_id, level_taken, issue_faced };

      try {
        const response = await fetch("http://localhost:3000/requests", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestData)
        });
        const data = await response.json();
        if (response.ok) {
          alert("Request submitted successfully! Request ID: " + data.request_id);
          setTimeout(() => {
            window.location.href = "/student";
          }, 2000);
        } else {
          alert("Error: " + data.message);
        }
      } catch (error) {
        console.error("Error submitting request:", error);
        alert("Error submitting request.");
      }
    });

    // Notification polling every 3 seconds
    setInterval(async () => {
      try {
        const response = await fetch("http://localhost:3000/notifications", {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("token")
          },
          credentials: "include"
        });
        if (!response.ok) {
          throw new Error("Failed to fetch notifications");
        }
        const notifications = await response.json();
        const notifContainer = document.getElementById("notifContainer");
        notifContainer.innerHTML = "";
        if (notifications.length > 0) {
          notifications.forEach((notification) => {
            const notifDiv = document.createElement("div");
            notifDiv.classList.add("notification");
            notifDiv.innerHTML = `
              <p>${notification.message}</p>
              <a href="/requests/${notification.request_id}">View Details</a>
            `;
            notifContainer.appendChild(notifDiv);
            setTimeout(() => {
              notifDiv.remove();
            }, 5000);
          });
        }
      } catch (error) {
        console.error("Error fetching notifications:", error);
      }
    }, 3000);
  </script>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
</body>

</html>
