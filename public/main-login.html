<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - RAUS</title>
  <link rel="icon" href="/Screenshot (125).png" type="image/x-icon">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      max-width: 900px;
      width: 90%;
      display: flex;
      flex-wrap: wrap;
    }

    .login-form-section,
    .login-image-section {
      flex: 1 1 400px;
      min-width: 300px;
    }

    .login-form-section {
      padding: 2rem;
    }

    .login-form-section h2 {
      margin-bottom: 1rem;
      font-size: 2rem;
      color: #020167;
    }

    .underline {
      width: 50px;
      height: 4px;
      background: #020167;
      margin-bottom: 2rem;
      border-radius: 2px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    form label {
      font-size: 1rem;
      color: #333;
    }

    form input {
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 100%;
    }

    form button {
      padding: 0.75rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 5px;
      background: #020167;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    form button:hover {
      background: #010f47;
    }

    .error-message {
      color: #e74c3c;
      text-align: center;
      margin-top: 10px;
      font-size: 1rem;
    }

    .success-message {
      display: none;
      background: #27ae60;
      color: #fff;
      padding: 1rem;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 1rem;
    }

    .login-image-section {
      background: url('login-page.jpg') no-repeat center center;
      background-size: cover;
      min-height: 400px;
    }

    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }

      .login-image-section {
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-form-section">
      <div id="successMessage" class="success-message">
        Login successful
      </div>
      <h2>Login</h2>
      <div class="underline"></div>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <button type="submit" id="loginButton">Login</button>
      </form>
      <div id="errorMessage" class="error-message"></div>
    </div>
    <div class="login-image-section">
      <!-- Background image will be shown here -->
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      document.getElementById("errorMessage").textContent = "";
      const loginButton = document.getElementById("loginButton");
      // Store original text
      const originalText = loginButton.textContent;
      // Disable the button and add a spinner animation
      loginButton.disabled = true;
      loginButton.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>`;

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email, password })
        });
        // Wait 2.5 seconds to let the animation play
        await new Promise(resolve => setTimeout(resolve, 2500));
        const data = await response.json();
        if (response.ok) {
          document.getElementById("successMessage").style.display = "block";
          localStorage.setItem("token", data.token);
          localStorage.setItem("username", data.username);
          localStorage.setItem("UserID", data.userID);
          localStorage.setItem("Department", data.department);
          localStorage.setItem("role", data.role);
          const role = data.role.toLowerCase();
          const roleToEndpoint = {
            student: "/student",
            lecturer: "/lecturer-dashboard",
            hod: "/hod-dashboard",
            registrar: "/registrar"
          };
          setTimeout(() => {
            window.location.href = roleToEndpoint[role] || "/login";
          }, 2000);
        } else {
          document.getElementById("errorMessage").textContent = data.message || "Login failed.";
          // Alternatively, you could display an error modal here.
        }
      } catch (error) {
        console.error("Error during login:", error);
        document.getElementById("errorMessage").textContent = "An error occurred. Please try again later.";
      } finally {
        // Re-enable the button and restore its text
        loginButton.disabled = false;
        loginButton.textContent = originalText;
      }
    });
  </script>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
</body>

</html>
