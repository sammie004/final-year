<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-container label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        .login-container input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }

        .login-container button:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: red;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <button type="submit">Login</button>
        </form>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
        
            // Clear any previous error message
            document.getElementById("errorMessage").textContent = "";
        
            // Get the input values
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
        
            try {
                const response = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",  // Include credentials if your server uses cookies
                    body: JSON.stringify({ email, password })
                });
        
                const data = await response.json();
                console.log("Returned role:", data.role); // Debug: log the role returned
        
                if (response.ok) {
                    alert("Login successful");
                    // Optionally store token and other user data
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("username", data.username);
                    localStorage.setItem("UserID", data.userID);
                    localStorage.setItem("Department",data.department)
                    localStorage.setItem("role",data.role)
                    // Normalize the role (assuming the backend returns lowercase values)
                    const role = data.role.toLowerCase();
        
                    // Mapping of roles to redirect endpoints
                    const roleToEndpoint = {
                      student: '/student',
                      lecturer: '/lecturer-dashboard',
                      hod: '/hod-dashboard',
                      registrar: '/registrar'
                    };
        
                    if (roleToEndpoint[role]) {
                        window.location.href = roleToEndpoint[role];
                    } else {
                        window.location.href = '/login'; // Fallback redirection
                    }
                } else {
                    // Display error message from the response
                    document.getElementById("errorMessage").textContent = data.message || "Login failed.";
                }
            } catch (error) {
                console.error("Error during login:", error);
                document.getElementById("errorMessage").textContent = "An error occurred. Please try again later.";
            }
        });
        </script>
        
</body>

</html>
